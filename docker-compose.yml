services:
  app:
    build: .
    container_name: user-api-app
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000" # only reachable from the server itself — nginx will proxy to it
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    container_name: user-api-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306" # not exposed publicly — only reachable from the server itself
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql # auto-runs on first startup only

  redis:
    image: redis:8-alpine
    container_name: user-api-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379" # not exposed publicly
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
