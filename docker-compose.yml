services:
  mysql:
    image: mysql:8.0 # Use the official MySQL 8.0 Docker image
    container_name: user-api-mysql
    restart: always
    environment: # MySQL config — like editing my.cnf but cleaner
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: userapi
      MYSQL_USER: apiuser
      MYSQL_PASSWORD: apipassword
    ports: # Map your machine's port 3306 to the container's port 3306
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:8-alpine # Lightweight official Redis image
    container_name: user-api-redis
    restart: always
    ports: # Map your machine's port 6379 to the container's port 6379
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes: # Persist data so it survives container restarts
  mysql_data:
  redis_data:
